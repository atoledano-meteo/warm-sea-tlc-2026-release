name: warm-sea-tlc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4
  - pandas=3.0
  - xarray=2026.7
  - netcdf4=1.7
  - h5py=3.16
  - scipy=1.17
  - matplotlib=3.11
  - cartopy=0.26
  - shapely=2.1
  - pyproj=3.7
  - metpy=1.7.1
  - pyyaml=6.0
  - cdsapi=0.7
  - pip
  - pip:
      - cpys==1.0.0
# wrf-python 1.3.4.1 (step `extract` of diagnose_vortices.py) needs NumPy < 2: install it in a separate environment.
